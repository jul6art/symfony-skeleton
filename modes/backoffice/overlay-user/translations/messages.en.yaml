# ⚠️ Flat, like every other `user.flash.*` key above — `redirectWithError()` resolves through
# `FlashTranslator`, whose `core.flash.domain_map` is empty by default in this skeleton, so every
# flash falls back to `messages`. These five are the upload-time refusals of the account import
# example (`jul6art/dataflow-bundle`); the three thrown INSIDE the row mapper live in `user.en.yaml`
# instead — they are rendered by the bundle's own report partial, which resolves its domain from
# the key's first segment rather than through a flash.
user.import.error.upload_failed: The file could not be uploaded.
user.import.error.file_too_large: The file exceeds the size allowed.
user.import.error.binary_spreadsheet: This is a spreadsheet workbook, not a text file. Save it as CSV and try again.
user.import.error.invalid_mime: This file type is not recognised.
user.import.error.mapping_required: Map at least one column before running the import.
permission.flash.saved: Permissions saved.
user.profile.flash.saved: Profile saved.
user.profile.flash.upload_failed: The picture could not be saved.

# File dropzone (form theme, `form_file_dropzone` block). It replaces the browser's own control,
# which renders its labels in the BROWSER's language rather than the application's.
form.file.drop_hint: Drop a file here
form.file.browse: or click to browse
form.file.selected: Selected file
# Appearance preferences saved. The key is emitted by `admin-bundle`, whose toast partial
# translates in `messages`: without this entry it shows up RAW.
appearance.flash.saved: Preferences saved.
# Unités de taille de fichier, passées au contrôleur `form--dropzone` : un bundle ne connaît
# pas la langue de l'application qui l'embarque.
form.file.units: B,KB,MB,GB
