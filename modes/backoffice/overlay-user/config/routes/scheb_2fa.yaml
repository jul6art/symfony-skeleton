# La page du code et son chemin de contrôle (scheb/2fa-bundle), sous le pare-feu `main` : le pare-feu
# intercepte `/2fa_check`, le contrôleur de scheb rend `/2fa` avec le gabarit d'admin-bundle.
2fa_login:
    path: /2fa
    defaults:
        _controller: "scheb_two_factor.form_controller::form"

2fa_login_check:
    path: /2fa_check
